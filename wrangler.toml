name = "snoopy-bank"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# Enlace a base de datos Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "snoopy-db"
database_id = "snoopy-bank-db-id" # Reemplazar con el ID devuelto por 'npx wrangler d1 create snoopy-db'
migrations_dir = "./"
